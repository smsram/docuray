name: docuray
description: "DocuRay - AI Document Scanner & PDF"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Local storage for settings/onboarding
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^6.2.1

  # UUID for document IDs
  uuid: ^4.5.1

  # Intl for date formatting
  intl: ^0.19.0

  # Camera and ML
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.0
  permission_handler: ^11.3.1

  # Image processing & PDF
  image: ^4.3.0
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
    - assets/models/
